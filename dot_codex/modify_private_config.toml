#!/bin/sh
set -eu

# Mirror the live file's trailing-newline shape instead of forcing one. awk always
# terminates its last line; the ZeroOps installer appends its block WITHOUT one.
# Neither tool owns the tail for good — ZeroOps stamps the current end of file,
# but a new Codex [projects."..."] trust entry appends after it and terminates —
# so any fixed choice here becomes 1-byte cosmetic drift the moment the other
# writes last. The X sentinel is needed because $(cat) alone strips trailing
# newlines, which is exactly the fact being preserved.
raw=$(cat; printf X)
input=${raw%X}

NL='
'
case "$input" in
  *"$NL") trailing_newline=1 ;;
  *)      trailing_newline=0 ;;
esac

# Keep the owned tables ahead of other tables, but after TOML root settings.
# Move whole tables so local keys stay in their original scope. ZeroOps markers
# belong to its block, even when a table being moved lies between those markers.
config=$(printf '%s\n' "$input" | awk '
function emit(part) {
  sub(/^\n+/, "", part)
  sub(/\n+$/, "", part)
  if (part != "") {
    if (emitted) print ""
    print part
    emitted = 1
  }
}

/^[[:space:]]*# ZEROOPS-(BEGIN|END)([[:space:]]|$)/ {
  started_tables = 1
  parts["rest"] = parts["rest"] $0 "\n"
  next
}

/^[[:space:]]*\[[^]]+\][[:space:]]*(#.*)?$/ {
  started_tables = 1
  section = $0
  sub(/^[[:space:]]*\[/, "", section)
  sub(/\][[:space:]]*(#.*)?$/, "", section)
  owned = section == "features" || section == "desktop" || section == "memories"
}

{
  bucket = owned ? section : (started_tables ? "rest" : "head")
  parts[bucket] = parts[bucket] $0 "\n"
}

END {
  emit(parts["head"])
  emit(parts["features"] != "" ? parts["features"] : "[features]")
  emit(parts["desktop"] != "" ? parts["desktop"] : "[desktop]")
  emit(parts["memories"] != "" ? parts["memories"] : "[memories]")
  emit(parts["rest"])
}
' | awk '
BEGIN {
  skip_removed_mcp_section = 0
  skip_status_line_array = 0
  previous_blank = 0
  in_section = 0
  in_tui_section = 0
  tui_section_seen = 0
  status_line_printed = 0
  managed_section = ""
  skip_reasoning_efforts_array = 0
  print "# chezmoi-managed: portable Codex defaults"
  print "approvals_reviewer = \"auto_review\""
  print ""
  printed_any = 1
  previous_blank = 1
}

function print_managed_settings(section) {
  if (section == "features") {
    print "hooks = true"
    print "memories = true"
  } else if (section == "desktop") {
    print "show-context-window-usage = true"
    print "enabled-reasoning-efforts = [\"low\", \"medium\", \"high\", \"xhigh\", \"ultra\", \"persistent\", \"max\"]"
  } else if (section == "memories") {
    print "generate_memories = true"
    print "use_memories = true"
  }
}

function print_status_line() {
  print "status_line = ["
  print "    \"model-with-reasoning\","
  print "    \"approval-mode\","
  print "    \"current-dir\","
  print "    \"git-branch\","
  print "    \"context-remaining\","
  print "    \"context-window-size\","
  print "    \"used-tokens\","
  print "    \"total-input-tokens\","
  print "    \"total-output-tokens\","
  print "    \"five-hour-limit\","
  print "    \"weekly-limit\","
  print "    \"run-state\","
  print "    \"task-progress\","
  print "]"
  print "status_line_use_colors = true"
  status_line_printed = 1
  previous_blank = 0
  printed_any = 1
}

function print_tui_status_line_if_needed() {
  if (in_tui_section && !status_line_printed) {
    if (printed_any && !previous_blank) {
      print ""
    }
    print_status_line()
  }
}

/^[[:space:]]*\[[^]]+\][[:space:]]*(#.*)?$/ {
  print_tui_status_line_if_needed()
  in_section = 1
  in_tui_section = 0
  status_line_printed = 0
  managed_section = ""
  section = $0
  sub(/^[[:space:]]*\[/, "", section)
  sub(/\][[:space:]]*(#.*)?$/, "", section)

  # Remove retired servers, including nested tables such as their environment.
  skip_removed_mcp_section = section ~ /^mcp_servers\.(context7|mgrep)(\.|$)/
  if (skip_removed_mcp_section) {
    next
  }

  if (section == "tui") {
    in_tui_section = 1
    tui_section_seen = 1
  }
  print
  if (section == "features" || section == "desktop" || section == "memories") {
    managed_section = section
    print_managed_settings(section)
  }
  previous_blank = 0
  printed_any = 1
  next
}

{
  if (skip_removed_mcp_section) {
    next
  }

  if (skip_reasoning_efforts_array) {
    array_line = $0
    sub(/#.*/, "", array_line)
    if (array_line ~ /\]/) {
      skip_reasoning_efforts_array = 0
    }
    next
  }

  if (managed_section == "features" && $0 ~ /^[[:space:]]*(hooks|memories)[[:space:]]*=/) {
    next
  }

  if (managed_section == "desktop" && $0 ~ /^[[:space:]]*show-context-window-usage[[:space:]]*=/) {
    next
  }

  if (managed_section == "desktop" && $0 ~ /^[[:space:]]*enabled-reasoning-efforts[[:space:]]*=/) {
    array_line = $0
    sub(/#.*/, "", array_line)
    if (array_line !~ /\]/) {
      skip_reasoning_efforts_array = 1
    }
    next
  }

  if (managed_section == "memories" && $0 ~ /^[[:space:]]*(generate_memories|use_memories)[[:space:]]*=/) {
    next
  }

  if (skip_status_line_array) {
    if ($0 ~ /\]/) {
      skip_status_line_array = 0
    }
    next
  }

  if ($0 ~ /^[[:space:]]*# chezmoi-managed: (context-engineering compaction policy|portable Codex defaults)[[:space:]]*$/) {
    next
  }

  if (!in_section && $0 ~ /^[[:space:]]*approvals_reviewer[[:space:]]*=/) {
    next
  }

  if (in_tui_section && $0 ~ /^[[:space:]]*status_line[[:space:]]*=/) {
    print_status_line()
    if ($0 !~ /\]/) {
      skip_status_line_array = 1
    }
    next
  }

  if (in_tui_section && $0 ~ /^[[:space:]]*status_line_use_colors[[:space:]]*=/) {
    next
  }

  if ($0 ~ /^[[:space:]]*$/) {
    if (printed_any && !previous_blank) {
      print ""
      previous_blank = 1
    }
    next
  }

  print
  previous_blank = 0
  printed_any = 1
}

END {
  print_tui_status_line_if_needed()

  if (!tui_section_seen) {
    if (printed_any && !previous_blank) {
      print ""
    }
    print "[tui]"
    print_status_line()
  }

}
')

if [ "$trailing_newline" = 1 ]; then
  printf '%s\n' "$config"
else
  printf '%s' "$config"
fi
