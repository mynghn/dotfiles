#!/bin/sh
set -eu

input=$(cat || true)

printf '%s\n' "$input" | awk '
BEGIN {
  skip_managed_mcp_section = 0
  previous_blank = 0
  in_section = 0
  printed_any = 0
  print "# chezmoi-managed: context-engineering compaction policy"
  print "compact_prompt = \"Summarize the conversation to free context, in the context-engineering spirit. Keep the working set: the current goal, key decisions and their rationale, live constraints, and open threads or next steps. Preserve must-not-lose instructions and the task statement verbatim. Replace bulky content with reloadable references (file paths, commit SHAs, URLs) instead of full payloads. Drop resolved tangents, dead ends, verbose tool output, and superseded attempts. Produce the smallest high-signal summary that still lets the work continue.\""
  print ""
  printed_any = 1
  previous_blank = 1
}

/^[[:space:]]*\[[^]]+\][[:space:]]*$/ {
  if ($0 ~ /^[[:space:]]*\[mcp_servers\.(mgrep|context7)\][[:space:]]*$/) {
    skip_managed_mcp_section = 1
    in_section = 1
    next
  }

  skip_managed_mcp_section = 0
  in_section = 1
  print
  previous_blank = 0
  printed_any = 1
  next
}

{
  if ($0 ~ /^[[:space:]]*# chezmoi-managed MCP servers[[:space:]]*$/) {
    next
  }

  if ($0 ~ /^[[:space:]]*# chezmoi-managed: context-engineering compaction policy[[:space:]]*$/) {
    next
  }

  if (!in_section && $0 ~ /^[[:space:]]*(model|model_reasoning_effort|tool_output_token_limit|web_search|compact_prompt)[[:space:]]*=/) {
    next
  }

  if (!skip_managed_mcp_section) {
    if ($0 ~ /^[[:space:]]*$/) {
      if (printed_any && !previous_blank) {
        print ""
        previous_blank = 1
      }
      next
    }

    print
    previous_blank = 0
    printed_any = 1
  }
}

END {
  if (printed_any && !previous_blank) {
    print ""
  }

  print "# chezmoi-managed MCP servers"
  print "[mcp_servers.mgrep]"
  print "command = \"mgrep\""
  print "args = [\"mcp\"]"
  print ""
  print "[mcp_servers.context7]"
  print "command = \"npx\""
  print "args = [\"-y\", \"@upstash/context7-mcp\"]"
}
'
