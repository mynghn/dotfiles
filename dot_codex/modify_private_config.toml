#!/bin/sh
set -eu

input=$(cat || true)

# awk always terminates its last line, but the ZeroOps installer appends its
# block WITHOUT a trailing newline and owns the tail of this file — so strip the
# one awk adds (via command substitution) to keep chezmoi's target == the live
# file instead of drifting by one byte after every ZeroOps rewrite.
printf '%s' "$(printf '%s\n' "$input" | awk '
BEGIN {
  context7_seen = 0
  skip_status_line_array = 0
  previous_blank = 0
  in_section = 0
  in_tui_section = 0
  tui_section_seen = 0
  status_line_printed = 0
  print "# chezmoi-managed: portable Codex defaults"
  print "approvals_reviewer = \"auto_review\""
  print ""
  printed_any = 1
  previous_blank = 1
}

function print_status_line() {
  print "status_line = ["
  print "    \"model-with-reasoning\","
  print "    \"approval-mode\","
  print "    \"current-dir\","
  print "    \"git-branch\","
  print "    \"context-remaining\","
  print "    \"context-window-size\","
  print "    \"used-tokens\","
  print "    \"total-input-tokens\","
  print "    \"total-output-tokens\","
  print "    \"five-hour-limit\","
  print "    \"weekly-limit\","
  print "    \"run-state\","
  print "    \"task-progress\","
  print "]"
  print "status_line_use_colors = true"
  status_line_printed = 1
  previous_blank = 0
  printed_any = 1
}

function print_tui_status_line_if_needed() {
  if (in_tui_section && !status_line_printed) {
    if (printed_any && !previous_blank) {
      print ""
    }
    print_status_line()
  }
}

/^[[:space:]]*\[[^]]+\][[:space:]]*$/ {
  print_tui_status_line_if_needed()
  in_section = 1
  in_tui_section = 0
  status_line_printed = 0

  # Only context7 EXISTING matters, not where it sits: leave an already-present
  # section where the live file put it (Codex rewrites this file and reorders
  # sections) and re-emit it at the end only when it is absent entirely.
  if ($0 ~ /^[[:space:]]*\[mcp_servers\.context7\][[:space:]]*$/) {
    context7_seen = 1
  }

  if ($0 ~ /^[[:space:]]*\[tui\][[:space:]]*$/) {
    in_tui_section = 1
    tui_section_seen = 1
  }
  print
  previous_blank = 0
  printed_any = 1
  next
}

{
  if (skip_status_line_array) {
    if ($0 ~ /\]/) {
      skip_status_line_array = 0
    }
    next
  }

  if ($0 ~ /^[[:space:]]*# chezmoi-managed: (context-engineering compaction policy|portable Codex defaults)[[:space:]]*$/) {
    next
  }

  if (!in_section && $0 ~ /^[[:space:]]*approvals_reviewer[[:space:]]*=/) {
    next
  }

  if (in_tui_section && $0 ~ /^[[:space:]]*status_line[[:space:]]*=/) {
    print_status_line()
    if ($0 !~ /\]/) {
      skip_status_line_array = 1
    }
    next
  }

  if (in_tui_section && $0 ~ /^[[:space:]]*status_line_use_colors[[:space:]]*=/) {
    next
  }

  if ($0 ~ /^[[:space:]]*$/) {
    if (printed_any && !previous_blank) {
      print ""
      previous_blank = 1
    }
    next
  }

  print
  previous_blank = 0
  printed_any = 1
}

END {
  print_tui_status_line_if_needed()

  if (!tui_section_seen) {
    if (printed_any && !previous_blank) {
      print ""
    }
    print "[tui]"
    print_status_line()
  }

  if (!context7_seen) {
    if (printed_any && !previous_blank) {
      print ""
    }
    print "# chezmoi-managed MCP servers"
    print "[mcp_servers.context7]"
    print "command = \"npx\""
    print "args = [\"-y\", \"@upstash/context7-mcp\"]"
  }
}
')"
